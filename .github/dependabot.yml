version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
      prefix-development: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: react
        versions: [">=19.4.0"]
      - dependency-name: react-dom
        versions: [">=19.4.0"]
      - dependency-name: "@types/react"
        versions: [">=19.4.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.4.0"]
